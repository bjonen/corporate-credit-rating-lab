[project]
name = "corporate-credit-rating-lab"
version = "0.1.0"
description = "Student exercise in corporate credit-rating analysis and machine learning using public data"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipykernel>=7.3,<8",
    "jupyterlab>=4.6,<5",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "seaborn>=0.13.2,<0.14",
    "xgboost>=2,<4",
]

[tool.uv]
package = false
